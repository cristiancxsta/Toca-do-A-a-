<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="logo">
        <img src="tocadoacailogo.jpg" alt="Logo Toca do Açaí" class="logo">
      </div>
      <nav>
        <a href="Estoque.html" class="ativo">Estoque</a>
        
        <a href="cadastro.html">Cadastro</a>
        <a href="saida.html">Saída</a>
      </nav>
      <div class="usuario">
        <div class="avatar">M</div>
        Marcos
        <small>Gerente</small>
      </div>
    </aside>
 
    <main class="conteudo">
      <div class="topo">
        <h1>Visão Geral Estoque</h1>
        <div class="acoes">
          <button class="btn-pilula" data-abrir="modal-cadastro">Novo Produto</button>
          <select class="mes" id="filtro-mes" aria-label="Filtrar por mês"></select>
        </div>
      </div>
 
      <section class="cards">
        <div class="card">
          <div class="rotulo">Itens Cadastrados</div>
          <div class="valor">0</div>
        </div>
        <div class="card">
          <div class="rotulo">Valor em Estoque</div>
          <div class="valor">R$00,00</div>
        </div>
        <div class="card">
          <div class="rotulo">Estoque Baixo</div>
          <div class="valor">0</div>
        </div>
      </section>


      <div class="painel-topo">
        <h4>Visão Geral Estoque</h4>
        <input class="busca" type="search" id="busca" placeholder="Pesquisar">
      </div>

       <section class="painel">
        <table id="tabela">
          <thead>
            <tr>
              <th>ID</th><th>Descrição</th><th>Categoria</th>
              <th class="num">Quantidade</th><th>Preço Unitário</th><th>Ações</th>
            </tr>
          </thead>
          <tbody>
            
          </tbody>
        </table>
      </section>

    
 
  <div class="overlay" id="modal-cadastro">
    <form class="modal" id="form-produto">
      <h2 id="titulo-produto">Adicionar Produto</h2>
      <div class="form-grid">
        <div>
          <label for="produto-nome">Nome do Produto *</label>
          <input id="produto-nome" type="text" placeholder="Ex: Sorvete" required>
        </div>
        <div>
          <label for="produto-quantidade">Quantidade *</label>
          <input id="produto-quantidade" type="number" step="1" min="0" placeholder="1,2,3..." required>
        </div>
        <div>
          <label for="produto-categoria">Categoria</label>
          <select id="produto-categoria" required>
            <option value="">Cadastre uma categoria primeiro</option>
          </select>
        </div>
        <div>
          <label for="produto-preco">Preço por Unidade</label>
          <input id="produto-preco" type="number" step="0.01" min="0" placeholder="0,00">
        </div>
        
      </div>
      <div class="modal-rodape">
        <button type="button" class="btn-voltar" data-fechar aria-label="Voltar">←</button>
        <button type="submit" class="btn-pilula" id="botao-salvar-produto">Adicionar</button>
      </div>
    </form>
  </div>
 
  <script src="script.js"></script>
</body>
</html>
