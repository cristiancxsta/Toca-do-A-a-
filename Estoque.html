<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="logo">
        <img src="tocadoacailogo.jpg" alt="Logo Toca do Açaí" class="logo">
      </div>
      <nav>
        <a href="Estoque.html" class="ativo">Estoque</a>
        <a href="financeiro.html">Financeiro</a>
        <a href="cadastro.html">Cadastro</a>
        <a href="saida.html">Saída</a>
      </nav>
      <div class="usuario">
        <div class="avatar">M</div>
        Marcos
        <small>Gerente</small>
      </div>
    </aside>
 
    <main class="conteudo">
      <div class="topo">
        <h1>Cadastro</h1>
        <div class="acoes">
          <button class="btn-pilula" data-abrir="modal-cadastro">Novo Cadastro</button>
          <select class="mes" aria-label="Mês">
            <option>Setembro</option>
            <option selected>Outubro</option>
            <option>Novembro</option>
          </select>
        </div>
      </div>
 
      <section class="cards">
        <div class="card">
          <div class="rotulo">Itens Cadastrados</div>
          <div class="valor">0</div>
        </div>
        <div class="card">
          <div class="rotulo">Valor em Estoque</div>
          <div class="valor">R$00,00</div>
        </div>
        <div class="card">
          <div class="rotulo">Estoque Baixo</div>
          <div class="valor">0</div>
        </div>
      </section>
 
     
 
  <div class="overlay" id="modal-cadastro">
    <form class="modal proto">
      <h2>Novo Cadastro</h2>
      <div class="form-grid">
        <div>
          <label>Seção *</label>
          <select required>
            <option value="">Ex: Contas a Receber</option>
            <option>Categorias</option>
            <option>Contas a Pagar</option>
            <option>Contas a Receber</option>
          </select>
        </div>
        <div>
          <label>Nome *</label>
          <input type="text" placeholder="Ex: Pedido" required>
        </div>
        <div>
          <label>Valor *</label>
          <input type="number" step="0.01" min="0" placeholder="R$0,00" required>
        </div>
        <div>
          <label>ID</label>
          <input type="text" value="Auto" readonly>
        </div>
        <div>
          <label>Descrição</label>
          <input type="text">
        </div>
        <div>
          <label>Nome do Cliente</label>
          <input type="text">
        </div>
        <div>
          <label>Data de Vencimento</label>
          <input type="date">
        </div>
        <div>
          <label>Status</label>
          <select>
            <option>Pendente</option>
            <option>Pago</option>
          </select>
        </div>
      </div>
      <div class="modal-rodape">
        <button type="button" class="btn-voltar" data-fechar aria-label="Voltar">←</button>
        <button type="submit" class="btn-pilula">Adicionar</button>
      </div>
    </form>
  </div>
 
  <script src="script.js"></script>
  <script>
    document.getElementById("busca").addEventListener("input", function (e) {
      var termo = e.target.value.toLowerCase();
      document.querySelectorAll(".coluna tbody tr").forEach(function (tr) {
        tr.style.display = tr.textContent.toLowerCase().includes(termo) ? "" : "none";
      });
    });
  </script>
</body>
</html>
