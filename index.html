<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth">
  <form class="auth-box" action="Estoque.html">
    <div class="logo">
      <img src="tocadoacailogo.jpg" alt="Logo Toca do Açaí" style="width: 90px; height: 90px; border-radius: 50%; object-fit: cover; display: block; margin: 0 auto;">
    </div>

    <div>
      <label for="email">E-MAIL</label>
      <input type="email" id="email" placeholder="Insira o seu E-mail" required>
    </div>
    <div>
      <label for="senha">SENHA</label>
      <input type="password" id="senha" placeholder="Insira a sua senha" required>
    </div>

    <button type="submit" class="btn-principal">LOGIN</button>

    <p class="auth-link">Não tem uma conta? <a href="register.html">Criar conta</a></p>

    <div class="toggle">
      <a href="index.html" class="ativo">Entrar</a>
      <a href="register.html">Criar conta</a>
    </div>
  </form> 
</body>
</html>
