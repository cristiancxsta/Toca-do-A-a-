<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saída de Produtos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="logo">
        <img src="tocadoacailogo.jpg" alt="Logo Toca do Açaí" class="logo">
      </div>
      <nav>
        <a href="Estoque.html">Estoque</a>
        
        <a href="cadastro.html">Cadastro</a>
        <a href="saida.html" class="ativo">Saída</a>
      </nav>
      <div class="usuario">
        <div class="avatar">M</div>
        Marcos
        <small>Gerente</small>
      </div>
    </aside>

    <main class="conteudo">
      <div class="topo">
        <h1>Saída de Produtos</h1>
        <div class="acoes">
          <input class="busca" type="search" id="busca" placeholder="Buscar produtos">
          <select class="mes" id="filtro-mes" aria-label="Filtrar por mês"></select>
          <button class="btn-pilula" data-abrir="modal-saida">Registrar saída</button>
        </div>
      </div>

      <section class="painel">
        <table id="tabela">
          <thead>
            <tr>
              <th>ID</th>
              <th>Descrição</th>
              <th>Categoria</th>
              <th class="num">Quantidade</th>
              <th>Motivo</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>
    </main>
  </div>

  <div class="overlay" id="modal-saida">
    <form class="modal" id="form-saida">
      <h2>Registrar saída</h2>
      <div class="form-grid">
        <div class="full">
          <label for="input-descricao">Produto</label>
          <select id="input-descricao" required>
            <option value="">Selecione um produto do estoque</option>
          </select>
        </div>

        <div>
          <label for="select-categoria">Categoria</label>
          <select id="select-categoria" required>
            <option value="">Selecione uma categoria</option>
          </select>
        </div>

        <div>
          <label for="input-valor">Valor (R$)</label>
          <input id="input-valor" type="number" step="0.01" min="0" placeholder="0.00" readonly>
        </div>

        <div>
          <label for="input-qtd">Quantidade</label>
          <input id="input-qtd" type="number" step="1" min="1" placeholder="0" required>
        </div>

        <div>
          <label for="input-data">Data</label>
          <input id="input-data" type="date">
        </div>

        <div class="full">
          <label for="select-motivo">Motivo</label>
          <select id="select-motivo" required>
            <option value="">Selecione o motivo</option>
            <option value="Venda">Venda</option>
            <option value="Produto vencido">Produto vencido</option>
            <option value="Perda / Avaria">Perda / Avaria</option>
          </select>
        </div>
      </div>

      <div class="modal-rodape">
        <button type="button" class="btn-voltar" data-fechar aria-label="Voltar">←</button>
        <button type="submit" class="btn-pilula">Registrar Saída</button>
      </div>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
