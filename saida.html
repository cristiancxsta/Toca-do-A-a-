<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <style>
        /* ============ RESET / BASE ============ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            font-family: "Segoe UI", Arial, Helvetica, sans-serif;
            background-color: #fcfcfc;
            color: var(--texto);
            display: flex;
            min-height: 100vh;
        }

        /* ============ SIDEBAR ============ */
        .sidebar {
            width: 220px;
            min-width: 110px;
            background: #350581;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo-area {
            
            margin-top: 10px;
            width: 100%;
            padding: 8px 0 4px 0;
            display: flex;
            justify-content: center;
        }



        .nav {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            margin-top: 50px;
        }

        .nav a {
            color: #ececec;
            text-decoration: none;
            font-size: 18px;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 4px;
            text-align: center;
        }

        .nav a:hover {
            background-color: rgba(255, 255, 255, 0.12);
        }

        .nav a.ativo {
            background-color: #FCD34D;
            color: #11002c;
            font-weight: 700;
        }

        .sidebar-footer {
            margin-top: auto;
            width: 100%;
            padding: 12px 10px 16px 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .user-chip {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .user-avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: #ffffff;
            border: 2px solid #6a4a9c;
            overflow: hidden;
            flex-shrink: 0;
        }

        .user-info { line-height: 1.15; }

        .user-name {
            color: #ffffff;
            font-size: 12px;
            font-weight: 600;
        }

        .user-role {
            color: #b9a6d6;
            font-size: 10px;
        }

        .sidebar-arrow {
            color: #ffffff;
            font-size: 14px;
            text-decoration: none;
        }

    </style>
</head>
<body>

    <!-- ============ BARRA LATERAL ============ -->
    <aside class="sidebar">
        <div class="logo-area">
            <img class="logo-area"src="img\logo.png" alt="Logo da Toca do Açaí" width="120">
            
        </div>

        <nav class="nav">
            <a href="#" class="ativo">Estoque</a>
            <a href="#">Financeiro</a>
            <a href="#">Cadastro</a>
            <a href="#">Saída</a>
        </nav>

        <div class="sidebar-footer">
            <div class="user-chip">
                <div class="user-avatar">
                    <!-- Foto do usuário inserida dinamicamente -->
                </div>
                <div class="user-info">
                    <div class="user-name">Marcos</div>
                    <div class="user-role">Admin</div>
                </div>
            </div>
            <a href="#" class="sidebar-arrow">&#8250;</a>
        </div>
    </aside>

    <!-- ============ CONTEÚDO ============ -->
    <main>


    </main>
    
</body>
</html>
